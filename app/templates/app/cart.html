<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng - Nhà thuốc Long Châu</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary-color: #0052cc;
      }
      body {
        background-color: #f8f9fa;
        font-family: "Segoe UI", sans-serif;
      }
      .bg-blue {
        background-color: var(--primary-color);
      }
      .cart-container {
        max-width: 900px;
        margin: 40px auto;
      }
      .product-img-cart {
        width: 80px;
        height: 80px;
        object-fit: contain;
      }
      .quantity-control {
        width: 100px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-blue py-3">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">
          <i class="fas fa-plus-square me-2"></i>NHÀ THUỐC LONG CHÂU
        </a>
        <a href="/" class="btn btn-outline-light btn-sm">
          <i class="fas fa-arrow-left me-1"></i> Tiếp tục mua hàng
        </a>
      </div>
    </nav>

    <div class="container cart-container">
      <h4 class="fw-bold mb-4">
        <i class="fas fa-shopping-basket me-2"></i>Giỏ hàng của bạn
      </h4>

      <div class="row">
        <div class="col-md-8">
          <div class="card border-0 shadow-sm p-3 mb-3">
            <div id="cart-content">
              <p class="text-center py-5">Đang tải giỏ hàng...</p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card border-0 shadow-sm p-3">
            <h6 class="fw-bold border-bottom pb-2">Tóm tắt đơn hàng</h6>
            <div class="d-flex justify-content-between my-3">
              <span>Tổng tiền:</span>
              <span id="total-price" class="fw-bold text-primary fs-5">0đ</span>
            </div>
            <button
              class="btn btn-primary w-100 fw-bold py-2"
              onclick="checkout()"
            >
              XÁC NHẬN ĐƠN HÀNG
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      let cart = JSON.parse(localStorage.getItem("pharmacyCart")) || [];

      function renderCart() {
        const container = document.getElementById("cart-content");
        const totalPriceEl = document.getElementById("total-price");

        if (cart.length === 0) {
          container.innerHTML = `
            <div class="text-center py-5">
              <i class="fas fa-cart-plus fs-1 text-muted mb-3"></i>
              <p>Giỏ hàng trống trơn hà!</p>
              <a href="/" class="btn btn-primary btn-sm">Mua thuốc ngay</a>
            </div>`;
          totalPriceEl.innerText = "0đ";
          return;
        }

        let html = "";
        let total = 0;

        cart.forEach((item, index) => {
          total += item.price * item.quantity;
          html += `
            <div class="d-flex align-items-center border-bottom py-3">
              <div class="flex-grow-1">
                <h6 class="mb-1 fw-bold">${item.name}</h6>
                <p class="small text-primary mb-0">${item.price.toLocaleString()}đ</p>
              </div>
              <div class="quantity-control d-flex align-items-center mx-3">
                <button class="btn btn-sm btn-outline-secondary" onclick="updateQty(${index}, -1)">-</button>
                <span class="mx-2">${item.quantity}</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="updateQty(${index}, 1)">+</button>
              </div>
              <button class="btn btn-link text-danger" onclick="removeItem(${index})">
                <i class="fas fa-trash"></i>
              </button>
            </div>`;
        });

        container.innerHTML = html;
        totalPriceEl.innerText = total.toLocaleString() + "đ";
      }

      function updateQty(index, change) {
        cart[index].quantity += change;
        if (cart[index].quantity < 1) cart[index].quantity = 1;
        saveAndReload();
      }

      function removeItem(index) {
        if (confirm("Bạn muốn xóa thuốc này khỏi giỏ?")) {
          cart.splice(index, 1);
          saveAndReload();
        }
      }

      function saveAndReload() {
        localStorage.setItem("pharmacyCart", JSON.stringify(cart));
        renderCart();
      }

      function checkout() {
        alert(
          "Cảm ơn bạn! Đơn hàng đang được xử lý hệ thống GIS để tìm nhà thuốc gần nhất.",
        );
        // Sau này bạn có thể chuyển hướng sang trang bản đồ tại đây
      }

      document.addEventListener("DOMContentLoaded", renderCart);
    </script>
  </body>
</html>
