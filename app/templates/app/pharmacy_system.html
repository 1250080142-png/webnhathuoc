<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ thống nhà thuốc - NHÀ THUỐC GIS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      :root {
        --primary-blue: #0052cc;
      }
      body {
        background-color: #f4f7fa;
        font-family: sans-serif;
      }

      /* Layout */
      .main-content {
        height: calc(100vh - 80px);
        display: flex;
        overflow: hidden;
      }
      .sidebar {
        width: 400px;
        background: white;
        border-right: 1px solid #dee2e6;
        overflow-y: auto;
        padding: 20px;
      }
      .map-container {
        flex-grow: 1;
        position: relative;
      }
      #map {
        height: 100%;
        width: 100%;
      }

      /* Search Box */
      .search-box {
        background: #fff;
        border-radius: 8px;
        border: 1px solid #ced4da;
        padding: 10px;
        margin-bottom: 15px;
      }
      .pharmacy-item {
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #eee;
        margin-bottom: 10px;
        cursor: pointer;
        transition: 0.2s;
      }
      .pharmacy-item:hover {
        background-color: #f0f4fb;
        border-color: var(--primary-blue);
      }
      .pharmacy-name {
        font-weight: bold;
        color: var(--primary-blue);
        margin-bottom: 5px;
      }
      .pharmacy-info {
        font-size: 0.85rem;
        color: #666;
      }

      /* Custom scrollbar */
      .sidebar::-webkit-scrollbar {
        width: 6px;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary shadow-sm">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/"
          ><i class="fas fa-plus-square me-2"></i>NHÀ THUỐC GIS</a
        >
        <span class="text-white small">Hệ thống nhà thuốc trên toàn quốc</span>
      </div>
    </nav>

    <div class="main-content">
      <div class="sidebar">
        <h5 class="fw-bold mb-3">Tìm kiếm nhà thuốc</h5>

        <div class="search-box">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-0"
              ><i class="fas fa-search text-muted"></i
            ></span>
            <input
              type="text"
              class="form-control border-0 shadow-none"
              placeholder="Tên đường, phường/xã..."
            />
          </div>
        </div>

        <div class="list-group list-group-flush mt-3">
          <p class="text-muted small">
            Nhà thuốc gợi ý ({{ pharmacies|length }})
          </p>

          {% for p in pharmacies %}
          <div
            class="pharmacy-item"
            onclick="flyToLocation({{ p.location_lat }}, {{ p.location_lon }}, '{{ p.name }}')"
          >
            <div class="pharmacy-name">{{ p.name }}</div>
            <div class="pharmacy-info">
              <i class="fas fa-map-marker-alt me-1"></i> {{ p.address }}<br />
              <i class="fas fa-phone me-1"></i> {{ p.phone }}
            </div>
          </div>
          {% empty %}
          <p class="text-center text-muted mt-4">Chưa có dữ liệu nhà thuốc.</p>
          {% endfor %}
        </div>
      </div>

      <div class="map-container">
        <div id="map"></div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // 1. Khởi tạo bản đồ
      var map = L.map('map').setView([10.762622, 106.660172], 13);

      // 2. Thêm lớp bản đồ (Sáng và dễ nhìn)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // 3. Hiển thị tất cả Marker từ Database
      var markers = [];
      {% for p in pharmacies %}
          {% if p.location_lat and p.location_lon %}
              var marker = L.marker([{{ p.location_lat }}, {{ p.location_lon }}])
                  .addTo(map)
                  .bindPopup("<b>{{ p.name }}</b><br>{{ p.address }}");
              markers.push(marker);
          {% endif %}
      {% endfor %}

      // 4. Hàm khi click vào danh sách bên trái thì bản đồ bay tới điểm đó
      function flyToLocation(lat, lon, name) {
          map.flyTo([lat, lon], 16, {
              animate: true,
              duration: 1.5
          });

          // Mở popup tương ứng (tùy chọn)
          L.popup()
              .setLatLng([lat, lon])
              .setContent("<b>" + name + "</b>")
              .openOn(map);
      }
    </script>
  </body>
</html>
