<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ thống nhà thuốc - NHÀ THUỐC GIS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      :root {
        --primary-blue: #0052cc;
      }
      body {
        background-color: #f4f7fa;
        font-family: sans-serif;
        margin: 0;
      }
      .navbar {
        height: 60px;
      }
      .main-content {
        height: calc(100vh - 60px);
        display: flex;
        overflow: hidden;
      }
      .sidebar {
        width: 400px;
        background: white;
        border-right: 1px solid #dee2e6;
        overflow-y: auto;
        padding: 20px;
      }
      .map-container {
        flex-grow: 1;
        position: relative;
      }
      #map {
        height: 100%;
        width: 100%;
      }
      .search-box {
        background: #fff;
        border-radius: 8px;
        border: 1px solid #ced4da;
        padding: 10px;
        margin-bottom: 15px;
      }
      .pharmacy-item {
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #eee;
        margin-bottom: 10px;
        cursor: pointer;
        transition: 0.2s;
      }
      .pharmacy-item:hover {
        background-color: #f0f4fb;
        border-color: var(--primary-blue);
      }
      .pharmacy-name {
        font-weight: bold;
        color: var(--primary-blue);
        margin-bottom: 5px;
      }
      .pharmacy-info {
        font-size: 0.85rem;
        color: #666;
      }
      .distance-tag {
        font-size: 0.8rem;
        font-weight: bold;
        color: #dc3545;
        background: #ffebeb;
        padding: 2px 8px;
        border-radius: 12px;
        float: right;
      }
      .sidebar::-webkit-scrollbar {
        width: 6px;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary shadow-sm">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="#"
          ><i class="fas fa-plus-square me-2"></i>NHÀ THUỐC GIS</a
        >
        <span class="text-white small"
          >Chi nhánh Long Châu - Quận Tân Bình</span
        >
      </div>
    </nav>

    <div class="main-content">
      <div class="sidebar">
        <h5 class="fw-bold mb-3">Tìm kiếm nhà thuốc</h5>
        <div class="search-box">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-0"
              ><i class="fas fa-search text-muted"></i
            ></span>
            <input
              type="text"
              id="searchInput"
              class="form-control border-0 shadow-none"
              placeholder="Nhập tên đường..."
              onkeyup="searchPharmacy()"
            />
          </div>
        </div>
        <div id="pharmacyList" class="list-group list-group-flush mt-3"></div>
      </div>
      <div class="map-container">
        <div id="map"></div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // 1. Dữ liệu thực tế nhà thuốc
      const pharmacies = [
        {
          name: "Long Châu 177 Hoàng Hoa Thám",
          address: "47 Hoàng Hoa Thám, P.13, Tân Bình",
          phone: "1800 6928",
          lat: 10.79989,
          lon: 106.64713,
        },
        {
          name: "Long Châu 112 Trường Chinh",
          address: "112-114 Trường Chinh, P.12, Tân Bình",
          phone: "1800 6928",
          lat: 10.79435,
          lon: 106.651,
        },
        {
          name: "Long Châu Thân Nhân Trung",
          address: "16 Thân Nhân Trung, P.13, Tân Bình",
          phone: "1800 6928",
          lat: 10.80314,
          lon: 106.64261,
        },
        {
          name: "Long Châu 1010 Âu Cơ",
          address: "1010 Âu Cơ, P.14, Tân Bình",
          phone: "1800 6928",
          lat: 10.79927,
          lon: 106.6374,
        },
        {
          name: "Long Châu 1KA Bình Giã",
          address: "1KA Bình Giã, P.13, Tân Bình",
          phone: "1800 6928",
          lat: 10.79883,
          lon: 106.64418,
        },
      ];

      let userLocation = null;

      // 2. Khởi tạo bản đồ
      var map = L.map("map").setView([10.799, 106.645], 14);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      // 3. Hàm tính khoảng cách Haversine (Chuẩn xác cho bản đồ)
      function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // Bán kính Trái Đất (km)
        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos((lat1 * Math.PI) / 180) *
            Math.cos((lat2 * Math.PI) / 180) *
            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return (R * c).toFixed(2); // Trả về km làm tròn 2 chữ số
      }

      // 4. Hiển thị danh sách và Marker
      function renderPharmacies(data) {
        const listContainer = document.getElementById("pharmacyList");
        listContainer.innerHTML = `<p class="text-muted small">Nhà thuốc gợi ý (${data.length})</p>`;

        data.forEach((p) => {
          L.marker([p.lat, p.lon])
            .addTo(map)
            .bindPopup(`<b>${p.name}</b><br>${p.address}`);

          let distanceHtml = "";
          if (userLocation) {
            const dist = calculateDistance(
              userLocation.lat,
              userLocation.lng,
              p.lat,
              p.lon,
            );
            distanceHtml = `<span class="distance-tag">${dist} km</span>`;
          }

          const item = document.createElement("div");
          item.className = "pharmacy-item";
          item.onclick = () => flyToLocation(p.lat, p.lon, p.name);
          item.innerHTML = `
            ${distanceHtml}
            <div class="pharmacy-name">${p.name}</div>
            <div class="pharmacy-info">
              <i class="fas fa-map-marker-alt me-1"></i> ${p.address}<br />
              <i class="fas fa-phone me-1"></i> ${p.phone}
            </div>
          `;
          listContainer.appendChild(item);
        });
      }

      function flyToLocation(lat, lon, name) {
        map.flyTo([lat, lon], 17, { animate: true, duration: 1.5 });
        L.popup()
          .setLatLng([lat, lon])
          .setContent("<b>" + name + "</b>")
          .openOn(map);
      }

      function searchPharmacy() {
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const filtered = pharmacies.filter(
          (p) =>
            p.address.toLowerCase().includes(query) ||
            p.name.toLowerCase().includes(query),
        );
        renderPharmacies(filtered);
      }

      // 5. Lấy vị trí người dùng để tính khoảng cách thực tế
      map.locate({ setView: false, maxZoom: 16 });
      map.on("locationfound", function (e) {
        userLocation = e.latlng;
        L.circle(e.latlng, e.accuracy / 2).addTo(map); // Vẽ vòng tròn vị trí người dùng
        L.marker(e.latlng).addTo(map).bindPopup("Vị trí của bạn").openPopup();
        renderPharmacies(pharmacies); // Vẽ lại danh sách sau khi có vị trí để hiện số km
      });

      // Khởi tạo ban đầu
      renderPharmacies(pharmacies);
    </script>
  </body>
</html>
