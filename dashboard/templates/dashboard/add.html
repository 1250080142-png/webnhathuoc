<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Thêm sản phẩm - Long Châu</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background-color: #f4f6f9;
        padding: 40px 0;
      }
      .card-form {
        border: none;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      .form-label {
        font-weight: 600;
        color: #34495e;
      }
      .preview-img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 8px;
        border: 2px solid #ddd;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="mb-3">
            <a
              href="{% url 'admin_dashboard' %}"
              class="text-decoration-none text-muted"
            >
              <i class="fas fa-arrow-left"></i> Quay lại danh sách
            </a>
          </div>
          <div class="card card-form p-4 p-md-5">
            <h2 class="fw-bold text-success mb-4">
              <i class="fas fa-plus-circle me-2"></i>Thêm thuốc mới
            </h2>
            <hr class="mb-4" />

            <form method="POST" enctype="multipart/form-data">
              {% csrf_token %}
              <div class="row">
                <div class="col-md-12 mb-3">
                  <label class="form-label">Tên sản phẩm</label>
                  <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Nhập tên thuốc..."
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Danh mục / Phân loại</label>
                  <input
                    type="text"
                    name="category"
                    class="form-control"
                    placeholder="Ví dụ: Thực phẩm chức năng"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Đơn vị tính</label>
                  <input
                    type="text"
                    name="unit"
                    class="form-control"
                    placeholder="Viên, Hộp, Vỉ..."
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Giá bán (VNĐ)</label>
                  <input
                    type="number"
                    name="price"
                    class="form-control"
                    placeholder="0"
                  />
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label text-primary"
                    >Hình ảnh sản phẩm (Chọn nhiều ảnh)</label
                  >
                  <input
                    type="file"
                    name="images"
                    id="imageInput"
                    class="form-control"
                    accept="image/*"
                    multiple
                    required
                  />
                </div>

                <div class="col-md-12 mb-3">
                  <div
                    id="imagePreview"
                    class="d-flex flex-wrap gap-2 mt-2"
                  ></div>
                </div>
              </div>

              <div class="mt-4 d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{% url 'admin_dashboard' %}" class="btn btn-light px-4"
                  >Hủy bỏ</a
                >
                <button type="submit" class="btn btn-success px-5 fw-bold">
                  Lưu sản phẩm
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Script xử lý xem trước nhiều ảnh khi chọn file
      document
        .getElementById("imageInput")
        .addEventListener("change", function (event) {
          const previewContainer = document.getElementById("imagePreview");
          previewContainer.innerHTML = ""; // Xóa preview cũ

          const files = event.target.files;
          if (files) {
            Array.from(files).forEach((file) => {
              const reader = new FileReader();
              reader.onload = function (e) {
                const img = document.createElement("img");
                img.src = e.target.result;
                img.classList.add("preview-img");
                previewContainer.appendChild(img);
              };
              reader.readAsDataURL(file);
            });
          }
        });
    </script>
  </body>
</html>
