<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Xác nhận xóa</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light d-flex align-items-center" style="height: 100vh">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card border-0 shadow-lg text-center p-4">
            <div class="card-body">
              <div class="mb-4 text-danger">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="64"
                  height="64"
                  fill="currentColor"
                  class="bi bi-exclamation-triangle-fill"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"
                  />
                </svg>
              </div>
              <h3 class="fw-bold">Xác nhận xóa?</h3>
              <p class="text-muted">
                Bạn có chắc chắn muốn xóa thuốc <br /><strong
                  >"{{ medicine.name }}"</strong
                >?
              </p>
              <p class="small text-danger">Hành động này không thể hoàn tác.</p>

              <form method="POST" class="mt-4">
                {% csrf_token %}
                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-danger py-2 fw-bold">
                    Vẫn xóa nó
                  </button>
                  <a
                    href="{% url 'admin_dashboard' %}"
                    class="btn btn-light py-2"
                    >Không, quay lại</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
