<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Chỉnh sửa sản phẩm</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background-color: #f4f6f9;
        padding: 40px 0;
      }
      .card-form {
        border: none;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      .preview-img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 8px;
        border: 2px solid #ddd;
      }
      .current-img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 5px;
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div
            class="card card-form p-4 p-md-5 border-top border-warning border-5"
          >
            <h2 class="fw-bold text-dark mb-4">
              <i class="fas fa-edit text-warning me-2"></i>Chỉnh sửa thông tin
            </h2>
            <p class="text-muted small">
              Đang sửa: <strong>{{ medicine.name }}</strong>
            </p>
            <hr />

            <form method="POST" enctype="multipart/form-data">
              {% csrf_token %}
              <div class="row">
                <div class="col-md-12 mb-3">
                  <label class="form-label fw-bold">Tên sản phẩm</label>
                  <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ medicine.name }}"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Phân loại</label>
                  <input
                    type="text"
                    name="category"
                    class="form-control"
                    value="{{ medicine.category }}"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold">Đơn vị tính</label>
                  <input
                    type="text"
                    name="unit"
                    class="form-control"
                    value="{{ medicine.unit }}"
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label fw-bold"
                    >Giá bán hiện tại (VNĐ)</label
                  >
                  <input
                    type="number"
                    name="price"
                    class="form-control"
                    value="{{ medicine.price }}"
                  />
                </div>

                <div class="col-md-12 mb-3">
                  <label class="form-label fw-bold">Ảnh hiện tại:</label>
                  <div class="d-flex flex-wrap mb-2">
                    {% for img in medicine.images.all %}
                    <img
                      src="{{ img.image.url }}"
                      class="current-img border"
                      title="Ảnh cũ"
                    />
                    {% empty %}
                    <span class="text-muted small">Chưa có ảnh nào.</span>
                    {% endfor %}
                  </div>
                </div>

                <div class="col-md-12 mb-3">
                  <label class="form-label fw-bold text-primary"
                    >Tải lên ảnh mới (Chọn nhiều ảnh sẽ thay thế/bổ sung tùy
                    logic view)</label
                  >
                  <input
                    type="file"
                    name="images"
                    id="imageInput"
                    class="form-control"
                    accept="image/*"
                    multiple
                  />
                  <div
                    id="imagePreview"
                    class="d-flex flex-wrap gap-2 mt-3"
                  ></div>
                </div>
              </div>

              <div class="mt-4 d-flex justify-content-between">
                <a
                  href="{% url 'admin_dashboard' %}"
                  class="btn btn-outline-secondary px-4"
                  >Quay về</a
                >
                <button type="submit" class="btn btn-warning px-5 fw-bold">
                  Cập nhật ngay
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Xử lý xem trước ảnh mới khi người dùng chọn file
      document
        .getElementById("imageInput")
        .addEventListener("change", function (event) {
          const previewContainer = document.getElementById("imagePreview");
          previewContainer.innerHTML = "";

          const files = event.target.files;
          if (files) {
            Array.from(files).forEach((file) => {
              const reader = new FileReader();
              reader.onload = function (e) {
                const img = document.createElement("img");
                img.src = e.target.result;
                img.classList.add("preview-img");
                previewContainer.appendChild(img);
              };
              reader.readAsDataURL(file);
            });
          }
        });
    </script>
  </body>
</html>
