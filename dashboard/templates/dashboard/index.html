<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ thống Quản lý Nhà Thuốc</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .navbar {
        background-color: #0056b3;
      }
      .card {
        border: none;
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="#"
          ><i class="fas fa-prescription-bottle-alt me-2"></i>QUẢN TRỊ NHÀ
          THUỐC</a
        >
      </div>
    </nav>

    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3><i class="fas fa-pills me-2 text-primary"></i>Danh mục thuốc</h3>
        <button class="btn btn-success">
          <i class="fas fa-plus me-2"></i>Thêm thuốc mới
        </button>
      </div>

      <div class="card p-3">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>Tên thuốc</th>
              <th>Phân loại</th>
              <th>Đơn vị</th>
              <th>Giá bán</th>
              <th class="text-center">Thao tác</th>
            </tr>
          </thead>
          <tbody>
            {% for m in medicines %}
            <tr>
              <td class="fw-bold text-primary">{{ m.name }}</td>
              <td>
                <span class="badge bg-info text-dark">{{ m.category }}</span>
              </td>
              <td>{{ m.unit }}</td>
              <td>{{ m.price }}đ</td>
              <td class="text-center">
                <button class="btn btn-sm btn-outline-warning me-1">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger">
                  <i class="fas fa-trash"></i>
                </button>
              </td>
            </tr>
            {% empty %}
            <tr>
              <td colspan="5" class="text-center py-4 text-muted">
                Chưa có dữ liệu thuốc. Hãy thêm mới để bắt đầu quản lý!
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
